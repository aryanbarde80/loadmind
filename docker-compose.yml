services:
  loadmind:
    build: .
    ports:
      - "${LOADMIND_PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      LOADMIND_DEMO_MODE: ${LOADMIND_DEMO_MODE:-true}
      LOADMIND_UPSTREAMS: ${LOADMIND_UPSTREAMS:-}
      LOADMIND_ALGORITHM: ${LOADMIND_ALGORITHM:-round-robin}
      LOADMIND_ADMIN_TOKEN: ${LOADMIND_ADMIN_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 3s
      start_period: 15s
      retries: 3
